name: Publish isolated ShoppingApp iPhone preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shopping-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout E3 source
        uses: actions/checkout@v4
        with:
          repository: MusicMeasurer/shopping-app
          ref: feature/e3-cloud-auth
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Isolate PWA scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          assert s.count('/shopping-app/') >= 4
          p.write_text(s.replace('/shopping-app/', '/shopping-app-preview/'))
          PY
      - name: Unit tests (without cloud configuration, as in source CI)
        run: npm test
      - name: Build against disposable Supabase lab
        env:
          VITE_SUPABASE_URL: https://gmrqeubhotjpmtwokfeq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iN1Oxw6kkBK0eEjvFy3YZw_4wWpwRJ3
        run: |
          npm run build
          grep -q '/shopping-app-preview/' dist/manifest.webmanifest
      - name: Build isolated E4 preview alongside E3
        run: |
          mkdir -p /tmp/e3-preview-dist
          cp -a dist/. /tmp/e3-preview-dist/
      - name: Checkout tested E4 source (accessibility and archive safeguards)
        uses: actions/checkout@v4
        with:
          repository: MusicMeasurer/shopping-app
          ref: feature/e4-accessibility-archive-fixes
          path: e4-source
          persist-credentials: false
      - name: Build E4 in independent PWA scope
        working-directory: e4-source
        run: |
          npm ci
          npm test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          assert s.count('/shopping-app/') >= 4
          p.write_text(s.replace('/shopping-app/', '/shopping-app-preview/e4/'))
          PY
          npm run build
          grep -q '/shopping-app-preview/e4/' dist/manifest.webmanifest
      - name: Combine E3 and E4 without replacing E3
        run: |
          mkdir -p dist/e4
          cp -a e4-source/dist/. dist/e4/
          test -f dist/index.html
          test -f dist/e4/index.html
          test -f dist/e4/manifest.webmanifest
      - name: Checkout verified E3-E4 integration
        uses: actions/checkout@v4
        with:
          repository: MusicMeasurer/shopping-app
          ref: c99ec46f63c8dd3e4f9324db150fce4bbc1a5326
          path: integration-source
          persist-credentials: false
      - name: Build integrated iPhone acceptance preview
        working-directory: integration-source
        env:
          VITE_SUPABASE_URL: https://gmrqeubhotjpmtwokfeq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iN1Oxw6kkBK0eEjvFy3YZw_4wWpwRJ3
        run: |
          npm ci
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          source = p.read_text()
          assert source.count('/shopping-app/') >= 4
          p.write_text(source.replace('/shopping-app/', '/shopping-app-preview/integration/'))
          PY
          npm run build
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/manifest.webmanifest').read_text())
          expected = '/shopping-app-preview/integration/'
          assert all(manifest[key] == expected for key in ('id', 'start_url', 'scope'))
          assert expected + 'index.html' in Path('dist/sw.js').read_text()
          PY
          git rev-parse HEAD > dist/revision.txt
      - name: Add integration preview beside existing previews
        run: |
          mkdir -p dist/integration
          cp -a integration-source/dist/. dist/integration/
          test -f dist/integration/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4
